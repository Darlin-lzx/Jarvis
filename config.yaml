name: 跨工程迭代开发多Agent智能编排平台
host: 0.0.0.0
port: 5010
artifact_root: artifacts
db_path: data/db.sqlite3
mysql_url: "mysql+pymysql://root:root123@127.0.0.1:3306/jarvis"  # 非空启用MySQL，留空则用SQLite
chroma_dir: data/chroma
kb_collection: jarvis_kb
rag_top_k: 4
llm:
  provider: zhipu            # ollama | deepseek | bailian | zhipu
  base_url: "https://open.bigmodel.cn/api/coding/paas/v4"
  model: glm-5.3
  # api_key: "bc862869531640ff92f31b167306bcb0.G18Np3L1JHCjyLzJ"
  api_key: ""  # 密钥已迁移至 config.local.yaml（不入 git），也可用环境变量 JARVIS_LLM_API_KEY 覆盖
  embedding_model: text-embedding-v3
  embedding_provider: bailian
  embedding_api_key: ""  # 见 config.local.yaml / JARVIS_EMBEDDING_API_KEY
  temperature: 0.2
  max_tokens: 4096
ocr:
  provider: bailian
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: qwen-vl-ocr-2025-11-20
  api_key: ""  # 见 config.local.yaml / JARVIS_OCR_API_KEY
reliability:
  db_failure_threshold: 3
  db_recovery_seconds: 30
  llm_failure_threshold: 3
  llm_recovery_seconds: 60
  llm_retry_count: 3
  llm_retry_backoff_seconds: 1
  llm_timeout_seconds: 120
  node_timeout_seconds: 300
workflow:
  # 「远端库」开关（默认）：经数据源面板中名为「工作流配置库」的数据源读远端配置库
  datasource_name: "工作流配置库"
  version_table: "aif_comframe.vm_template_version"
  # 「本地库」开关：直读 Jarvis 自身元数据库（mysql_url 指向的 jarvis 库），
  # 无需注册数据源；表由 file/vm_template_mysql.sql 在 jarvis 库内创建
  local_version_table: "vm_template_version"
